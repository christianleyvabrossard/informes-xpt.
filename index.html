<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informes XPT</title>
<style>
:root{--bg:#e9edf0;--card:#fff;--ink:#14213d;--mut:#5b667a;--line:#cdd5dc;--acc:#f2b705;--accink:#14213d;--ok:#1d7a4d;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#e8edf5;--mut:#93a0b8;--line:#2d3b5a;--acc:#f2b705;--accink:#14213d;--ok:#4cc38a;--bad:#ff8a80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h1{font-size:clamp(1.2rem,3.5vw,1.6rem);margin:0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;min-height:44px;padding:8px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .n{font-weight:400;opacity:.75}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.layout{display:grid;gap:0 14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.layout{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.side{position:sticky;top:12px}}
.grid{display:grid;gap:0 12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.full{grid-column:1/-1}
.f{margin-top:10px}
label{display:block;font-weight:600;margin-bottom:4px}
input,textarea,select{width:100%;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:8px;margin:14px 0 4px;padding:0 12px 12px;min-width:0}
legend{font-weight:600;padding:0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.b{min-height:44px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button.d{color:var(--bad)}
button.s{min-height:40px;padding:7px 10px;font-size:.92rem}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:inherit;background:var(--bg);border-radius:8px;padding:10px;border:1px dashed var(--line)}
.meta{color:var(--mut);font-size:.88rem;margin-bottom:6px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid var(--line)}
.tag.sent{color:var(--ok);border-color:var(--ok)}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));align-items:start}
.cards .card{margin:0}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.code{min-height:40px;padding:6px 12px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font:inherit;font-weight:600;cursor:pointer}
.code:hover{border-color:var(--bad)}
.hint{color:var(--mut);font-size:.88rem;margin:6px 0 0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumbs:empty{display:none}
.thumb{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-8px;right:-8px;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--bad);font:inherit;font-size:1.2rem;line-height:1;cursor:pointer}
.total{font-size:2.4rem;font-weight:700;line-height:1}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90vw;text-align:center;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Informes XPT</h1>
</header>
<div class="tabs" role="tablist">
  <button role="tab" data-t="form" aria-selected="true"><span data-i18n="tab_form"></span></button>
  <button role="tab" data-t="hist" aria-selected="false"><span data-i18n="tab_hist"></span> <span class="n" id="cnt"></span></button>
  <button role="tab" data-t="cuenta" aria-selected="false"><span data-i18n="tab_cuenta"></span></button>
</div>

<section id="form" class="on">
 <div class="layout">
  <div class="card" id="fields"></div>
  <div class="side">
   <div class="card"><div class="meta" data-i18n="preview"></div><pre id="prev"></pre></div>
   <div class="row" style="margin-top:0">
    <button class="b p" id="save" data-i18n="save"></button>
    <button class="b" id="copy" data-i18n="copy"></button>
    <button class="b" id="wa">WhatsApp</button>
    <button class="b d" id="clear" data-i18n="clear"></button>
   </div>
   <p class="hint" id="editing" hidden data-i18n="editing"></p>
   <p class="hint" data-i18n="wa_hint"></p>
  </div>
 </div>
</section>

<section id="hist">
 <div class="row" style="margin:0 0 12px">
  <button class="b s" id="exp" data-i18n="exp"></button>
  <button class="b s" id="imp" data-i18n="imp"></button>
  <input type="file" id="file" accept="application/json" hidden>
 </div>
 <p class="hint" style="margin:-4px 0 12px" data-i18n="exp_note"></p>
 <div id="list" class="cards"></div>
</section>

<section id="cuenta">
 <div class="layout">
  <div>
   <div class="card">
    <label for="cin" data-i18n="c_label"></label>
    <input id="cin" data-ph="c_ph" autocomplete="off" autocapitalize="characters">
    <div class="row"><button class="b p" id="cadd" data-i18n="c_add"></button></div>
    <p class="hint" data-i18n="c_hint"></p>
   </div>
   <div class="card"><div class="meta" data-i18n="c_total"></div><div class="total" id="total">0</div></div>
   <div class="row" id="cacts" hidden style="margin-top:0"><button class="b s" id="ccopy" data-i18n="c_copy"></button><button class="b s d" id="cclear" data-i18n="c_clear"></button></div>
  </div>
  <div id="groups" class="cards"></div>
 </div>
</section>
</div>
<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const FIELDS=['turno','data','destino','motorista','pallets','gaiolas','qrprev','qrbip','todos','dupla','conferido','horacheck','inicio','doca','liberacao','lacres','obs','carregado'];
const KEY={h:'xpt_historial',c:'xpt_cuenta',d:'xpt_borrador'};

const T={pt:{tab_form:'Relatório',tab_hist:'Histórico',tab_cuenta:'Contagem',preview:'Pré-visualização',save:'Salvar no histórico',copy:'Copiar',clear:'Limpar',
 editing:'Editando um relatório do histórico. Ao salvar, ele será substituído.',exp:'Exportar cópia',imp:'Importar cópia',
 conf:'Conferência dos QRs',yes:'Sim',no:'Não',
 l_turno:'Turno',l_data:'Data',l_destino:'Destino',l_motorista:'Motorista',l_pallets:'Pallet(s)',l_gaiolas:'Gaiola(s)',
 l_qrprev:'Total de QRs previsto',l_qrbip:'Total de QRs bipado',l_todos:'Todos os QRs previstos foram bipados?',l_dupla:'Dupla checagem da bipagem realizada?',
 l_conferido:'Conferido por',l_horacheck:'Horário da dupla checagem',l_inicio:'Início do carregamento',l_doca:'Doca',l_liberacao:'Liberação do veículo',
 l_lacres:'Lacres',l_obs:'Observação',l_carregado:'Carregado por',
 c_label:'Código da gaiola (QR)',c_ph:'Ex.: Z2',c_add:'Adicionar',c_hint:'Adicione um por um. Eles são agrupados por letra e ordenados por número. Não vai no relatório.',
 c_total:'Quantidade total',c_copy:'Copiar lista',c_clear:'Limpar tudo',c_empty:'Ainda não há códigos.',c_tap:'Toque em um código para remover.',c_bad:'Código inválido: ',c_totaltxt:'Total: ',
 h_empty:'Ainda não há relatórios salvos.',sent:'Enviado',pend:'Pendente',m_sent:'Marcar como enviado',m_pend:'Marcar como pendente',edit:'Editar',del:'Excluir',sure:'Tem certeza? Toque de novo',
 t_empty:'O relatório está vazio',t_saved:'Salvo no histórico',t_copied:'Copiado',t_imp:'Cópia importada',t_badfile:'Arquivo inválido',t_nostore:'Não foi possível salvar neste navegador',
 photos:'Fotos (opcional)',add_photos:'Adicionar fotos',photos_hint:'Escolha da galeria. Ao tocar em WhatsApp, as fotos vão junto com o relatório.',
 wa_hint:'Com fotos, abre o menu de compartilhar do celular: escolha o WhatsApp e depois o grupo. O texto também é copiado, caso a legenda não apareça.',
 exp_note:'A cópia exportada não inclui as fotos.',rm_photo:'Remover foto',t_nophoto:'Este navegador não envia fotos. Enviei só o texto.',
 t_sharefail:'Não foi possível compartilhar',t_nophotosave:'Não foi possível salvar as fotos neste navegador',t_max30:'Máximo de 30 fotos',t_draft:'Rascunho recuperado'}
};
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast(tr('t_nostore'))}}
function normC(v){if(Array.isArray(v))return v.filter(x=>typeof x==='string');if(v&&typeof v==='object')return Object.values(v).flat().filter(x=>typeof x==='string');return[]}
const lang='pt';
const tr=k=>T[lang][k]??k;
let hist=load(KEY.h,[]), cuenta=normC(load(KEY.c,[])), editId=null;

/* Fotos: se guardan en IndexedDB (localStorage es muy chico para imágenes) */
const DB=new Promise((res,rej)=>{try{const r=indexedDB.open('xpt',1);r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const idb=(mode,fn)=>DB.then(db=>new Promise((res,rej)=>{const tx=db.transaction('fotos',mode);const rq=fn(tx.objectStore('fotos'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)}));
const cache={};
const toFile=(b,i)=>new File([b],'foto'+(i+1)+'.jpg',{type:b.type||'image/jpeg'});
async function getFiles(id){
  if(cache[id])return cache[id];
  try{const bl=await idb('readonly',s=>s.get(id));cache[id]=(bl||[]).map(toFile)}catch(e){cache[id]=[]}
  return cache[id]
}
let photos=[];const purls=[];
function setPhotos(a){
  photos=a;purls.splice(0).forEach(u=>URL.revokeObjectURL(u));
  const box=$('thumbs');box.innerHTML='';
  a.forEach((b,i)=>{
    const u=URL.createObjectURL(b);purls.push(u);
    const w=document.createElement('div');w.className='thumb';
    const im=document.createElement('img');im.src=u;im.alt='';
    const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label',tr('rm_photo'));
    x.onclick=()=>setPhotos(photos.filter((_,j)=>j!==i));
    w.append(im,x);box.appendChild(w)
  });
  $('pcount').textContent=a.length?'('+a.length+')':'';
  idb('readwrite',s=>a.length?s.put(a,'draft'):s.delete('draft')).catch(()=>{})
}
const photoFiles=()=>photos.map(toFile);
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return (await new Promise(r=>c.toBlob(r,'image/jpeg',0.82)))||file
  }catch(e){return file}
}
async function send(text,files,done){
  if(files.length&&navigator.canShare&&navigator.canShare({files})){
    try{
      if(navigator.clipboard)navigator.clipboard.writeText(text).catch(()=>{});
      await navigator.share({files,text});if(done)done()
    }catch(e){if(e.name!=='AbortError')toast(tr('t_sharefail'))}
    return
  }
  if(files.length)toast(tr('t_nophoto'));
  window.open(waLink(text),'_blank');if(done)done()
}

/* Borrador: lo que escribes se guarda solo y vuelve si cierras o recargas */
let dt;
function saveDraftNow(){
  clearTimeout(dt);const d={};FIELDS.forEach(f=>d[f]=$(f).value.trim());
  try{if(FIELDS.some(f=>d[f])||editId)localStorage.setItem(KEY.d,JSON.stringify({d,editId}));else localStorage.removeItem(KEY.d)}catch(e){}
}
const schedDraft=()=>{clearTimeout(dt);dt=setTimeout(saveDraftNow,400)};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveDraftNow()});
addEventListener('pagehide',saveDraftNow);
async function restoreDraft(){
  let r=null;try{r=JSON.parse(localStorage.getItem(KEY.d))}catch(e){}
  let ph=[];try{ph=(await idb('readonly',s=>s.get('draft')))||[]}catch(e){}
  const has=!!(r&&r.d&&FIELDS.some(f=>r.d[f]));
  if(!has&&!ph.length)return;
  if(has)FIELDS.forEach(f=>$(f).value=r.d[f]||'');
  if(r&&r.editId&&hist.some(h=>h.id===r.editId)){editId=r.editId;$('editing').hidden=false}
  setPhotos(ph);refresh();toast(tr('t_draft'))
}

/* Formulario */
function mk(id){
  const d=document.createElement('div');d.className='f'+(id==='obs'?' full':'');
  const ctl=(id==='todos'||id==='dupla')?`<select id="${id}"><option value=""></option><option value="Sim"></option><option value="Não"></option></select>`
    :id==='obs'?`<textarea id="${id}"></textarea>`:`<input id="${id}" autocomplete="off">`;
  d.innerHTML=`<label for="${id}" data-l="${id}"></label>`+ctl;return d
}
function grp(ids){const g=document.createElement('div');g.className='grid';ids.forEach(i=>g.appendChild(mk(i)));return g}
(function(){
  const box=$('fields');
  box.appendChild(grp(['turno','data','destino','motorista','pallets','gaiolas']));
  const fs=document.createElement('fieldset');fs.innerHTML='<legend data-i18n="conf"></legend>';
  fs.appendChild(grp(['qrprev','qrbip','todos','dupla','conferido','horacheck']));box.appendChild(fs);
  box.appendChild(grp(['inicio','doca','liberacao','lacres','carregado','obs']));
  const pf=document.createElement('div');pf.className='f';
  pf.innerHTML='<label data-i18n="photos"></label><div class="row" style="margin-top:0"><button type="button" class="b" id="padd" data-i18n="add_photos"></button> <span class="meta" id="pcount" style="align-self:center;margin:0"></span></div><input type="file" id="pick" accept="image/*" multiple hidden><div class="thumbs" id="thumbs"></div><p class="hint" data-i18n="photos_hint"></p>';
  box.appendChild(pf);
})();

function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.remove('show'),1800)}
function tapConfirm(btn,fn){
  if(btn.dataset.armed){clearTimeout(btn._t);btn.textContent=btn.dataset.orig;delete btn.dataset.armed;fn();return}
  btn.dataset.armed='1';btn.dataset.orig=btn.textContent;btn.textContent=tr('sure');
  btn._t=setTimeout(()=>{btn.textContent=btn.dataset.orig;delete btn.dataset.armed},3000)
}
const val=id=>$(id).value.trim();

/* El informe siempre sale en portugués, sea cual sea el idioma de la página */
function build(d){
  const f=(t,v)=>v?t+' '+v:'';
  const lines=a=>a.filter(Boolean).join('\n');
  const head=lines([d.turno?'*REPORT XPTs – TURNO:* '+d.turno:'*REPORT XPTs*',f('Data:',d.data),f('Destino:',d.destino),f('Motorista:',d.motorista),f('Pallet(s):',d.pallets),f('Gaiola(s):',d.gaiolas)]);
  const tot=lines([f('Total de QRs previsto:',d.qrprev),f('Total de QRs bipado:',d.qrbip)]);
  const chk=lines([f('Todos os QRs previstos foram bipados?',d.todos),f('Dupla checagem da bipagem realizada?',d.dupla),f('Conferido por:',d.conferido),f('Horário da dupla checagem:',d.horacheck)]);
  const conf=(tot||chk)?'*Conferência dos QRs*\n'+[tot,chk].filter(Boolean).join('\n\n'):'';
  const carga=lines([f('Início do carregamento:',d.inicio),f('Doca:',d.doca),f('Liberação do veículo:',d.liberacao)]);
  const fim=lines([f('Lacres:',d.lacres),f('Observação:',d.obs),f('Carregado por:',d.carregado)]);
  return [head,conf,carga,fim].filter(Boolean).join('\n\n');
}
function data(){const d={};FIELDS.forEach(f=>d[f]=val(f));return d}
function refresh(){$('prev').textContent=build(data())}
FIELDS.forEach(f=>$(f).addEventListener('input',()=>{refresh();schedDraft()}));

async function copy(text){
  try{await navigator.clipboard.writeText(text)}
  catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  toast(tr('t_copied'))
}
const waLink=t=>'https://wa.me/?text='+encodeURIComponent(t);
function clearForm(){FIELDS.forEach(f=>$(f).value='');setPhotos([]);editId=null;$('editing').hidden=true;refresh();saveDraftNow()}
$('pick').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';
  const out=[];for(const f of fs)out.push(await shrink(f));
  let all=photos.concat(out);if(all.length>30){all=all.slice(0,30);toast(tr('t_max30'))}
  setPhotos(all)
};
$('padd').onclick=()=>$('pick').click();
$('clear').onclick=clearForm;
$('copy').onclick=()=>copy(build(data()));
$('wa').onclick=()=>send(build(data()),photoFiles());
$('save').onclick=async()=>{
  const d=data();
  if(!FIELDS.some(f=>d[f])&&!photos.length){toast(tr('t_empty'));return}
  let id=editId;
  if(id){const i=hist.find(h=>h.id===id);if(i){i.d=d;i.text=build(d)}}
  else{id=Date.now();hist.unshift({id,date:new Date().toISOString(),sent:false,d,text:build(d)})}
  try{await idb('readwrite',s=>photos.length?s.put(photos,id):s.delete(id))}catch(e){toast(tr('t_nophotosave'))}
  delete cache[id];
  store(KEY.h,hist);clearForm();renderHist();toast(tr('t_saved'))
};

/* Historial */
function renderHist(){
  const pend=hist.filter(h=>!h.sent).length;
  $('cnt').textContent=hist.length?`(${pend})`:'';
  const el=$('list');el.innerHTML='';
  if(!hist.length){el.className='';el.innerHTML='<div class="empty"></div>';el.firstChild.textContent=tr('h_empty');return}
  el.className='cards';
  hist.forEach(h=>{
    const c=document.createElement('div');c.className='card';
    const dt=new Date(h.date).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
    c.innerHTML=`<div class="meta"><span></span> <span class="tag ${h.sent?'sent':''}"></span></div><pre></pre><div class="row"></div>`;
    c.querySelector('.meta span').textContent=dt;
    c.querySelector('.tag').textContent=h.sent?tr('sent'):tr('pend');
    c.querySelector('pre').textContent=h.text;
    const th=document.createElement('div');th.className='thumbs';th.dataset.id=h.id;c.insertBefore(th,c.querySelector('.row'));
    const row=c.querySelector('.row');
    [['wa','WhatsApp','p'],['copy',tr('copy'),''],['sent',h.sent?tr('m_pend'):tr('m_sent'),''],['edit',tr('edit'),''],['del',tr('del'),'d']].forEach(([a,label,cls])=>{
      const b=document.createElement('button');b.className='b s '+cls;b.textContent=label;b.onclick=()=>act(h.id,a,b);row.appendChild(b)
    });
    el.appendChild(c)
  });
  loadThumbs()
}
const hurls=[];let hTok=0;
async function loadThumbs(){
  const my=++hTok;hurls.splice(0).forEach(u=>URL.revokeObjectURL(u));
  for(const th of document.querySelectorAll('#list .thumbs')){
    const files=await getFiles(+th.dataset.id);
    if(my!==hTok)return;
    files.forEach(f=>{const u=URL.createObjectURL(f);hurls.push(u);const i=document.createElement('img');i.src=u;i.alt='';th.appendChild(i)})
  }
}
function act(id,a,btn){
  const h=hist.find(x=>x.id===id);if(!h)return;
  if(a==='copy')copy(h.text);
  if(a==='wa'){const done=()=>{h.sent=true;store(KEY.h,hist);renderHist()};const go=()=>send(h.text,cache[id]||[],done);if(cache[id])go();else getFiles(id).then(go)}
  if(a==='sent'){h.sent=!h.sent;store(KEY.h,hist);renderHist()}
  if(a==='del')tapConfirm(btn,()=>{hist=hist.filter(x=>x.id!==id);store(KEY.h,hist);idb('readwrite',s=>s.delete(id)).catch(()=>{});delete cache[id];renderHist()});
  if(a==='edit'){FIELDS.forEach(f=>$(f).value=h.d[f]||'');editId=id;$('editing').hidden=false;refresh();getFiles(id).then(f=>setPhotos(f.slice()));saveDraftNow();tab('form')}
}
$('exp').onclick=()=>{
  const b=new Blob([JSON.stringify({hist,cuenta})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='informes-xpt-copia.json';a.click()
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{const j=JSON.parse(t);if(Array.isArray(j.hist))hist=j.hist;if(j.cuenta)cuenta=normC(j.cuenta);store(KEY.h,hist);store(KEY.c,cuenta);renderHist();renderCuenta();toast(tr('t_imp'))}catch(x){toast(tr('t_badfile'))}});
  e.target.value=''
};

/* Cuenta de códigos QR */
function parseCode(s){const m=/^([A-Z]+)(\d*)$/.exec(s);return{l:m[1],n:m[2]===''?0:+m[2]}}
function sortCodes(a){return a.sort((x,y)=>{const p=parseCode(x),q=parseCode(y);return p.l<q.l?-1:p.l>q.l?1:p.n-q.n})}
$('cadd').onclick=addCodes;
$('cin').addEventListener('keydown',e=>{if(e.key==='Enter')addCodes()});
function addCodes(){
  const items=$('cin').value.split(/[,;\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
  if(!items.length)return;
  const bad=items.filter(x=>!/^[A-Z]+\d*$/.test(x));
  if(bad.length){toast(tr('c_bad')+bad[0]);return}
  cuenta=sortCodes(cuenta.concat(items));
  store(KEY.c,cuenta);$('cin').value='';$('cin').focus();renderCuenta()
}
function grouped(){const g={};cuenta.forEach(c=>{const l=parseCode(c).l;(g[l]=g[l]||[]).push(c)});return g}
function renderCuenta(){
  $('total').textContent=cuenta.length;
  $('cacts').hidden=!cuenta.length;
  const el=$('groups');el.innerHTML='';
  if(!cuenta.length){el.className='';el.innerHTML='<div class="empty"></div>';el.firstChild.textContent=tr('c_empty');return}
  el.className='cards';
  const g=grouped();
  Object.keys(g).sort().forEach(l=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<strong></strong> <span class="meta"></span><div class="codes"></div>';
    c.querySelector('strong').textContent=l;
    c.querySelector('.meta').textContent='('+g[l].length+')';
    const box=c.querySelector('.codes');
    g[l].forEach(code=>{const b=document.createElement('button');b.className='code';b.textContent=code;b.onclick=()=>{cuenta.splice(cuenta.indexOf(code),1);store(KEY.c,cuenta);renderCuenta()};box.appendChild(b)});
    el.appendChild(c)
  });
  const p=document.createElement('p');p.className='hint';p.style.gridColumn='1/-1';p.textContent=tr('c_tap');el.appendChild(p)
}
$('ccopy').onclick=()=>{const g=grouped();copy(Object.keys(g).sort().map(l=>g[l].join(', ')).join('\n')+'\n'+tr('c_totaltxt')+cuenta.length)};
$('cclear').onclick=e=>tapConfirm(e.currentTarget,()=>{cuenta=[];store(KEY.c,cuenta);renderCuenta()});

/* Pestañas e idioma */
function tab(t){
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t))
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function applyLang(){
    document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=tr(e.dataset.ph));
  document.querySelectorAll('[data-l]').forEach(e=>e.textContent=tr('l_'+e.dataset.l));
  ['todos','dupla'].forEach(id=>{const o=$(id).options;o[0].textContent='—';o[1].textContent=tr('yes');o[2].textContent=tr('no')});
  renderHist();renderCuenta()
}
applyLang();refresh();restoreDraft();
</script>
</body>
